<div id="gambling-machine-container">
  <div id="token-panel">
    <output id="token-wallet-output" class="led-display">0000</output>
  </div>
  
  <div id="slot-panel">
    <div id="result-panel">
      <output class="status-annoucment led-display">YOU WON</output>
      <output id="correct-value-output" class="led-display">VALUE</output>
      <output class="status-annoucment led-display">YOU LOST</output>
    </div>
    
    <div id="slot-reel-panel">
      <div id="reel-slot-1" class="reel-slot">0</div>
      <div id="reel-slot-2" class="reel-slot">0</div>
      <div id="reel-slot-3" class="reel-slot">0</div>  
    </div>
  
  </div>
  
  
  <div id="control-panel">
    
    <button id="spin-button" class="ordinary-btn">
      <span>Spin !!!</span>  
    </button>
  
    <output id="gains-output" class="led-display" >.....</output>
    <div id="bet-inputs-panel">
      <input id="token-bet-input" class="led-display"/>
      <input id="swing-bet-input" class="led-display"/>
    </div>
      
  </div>
</div>
<script src="main.js"></script>
<link rel="stylesheet" href="main.css">
