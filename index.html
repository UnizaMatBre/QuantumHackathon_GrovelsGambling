<div id="gambling-machine-container">
  <div id="token-panel">
    <label for="token-wallet-output" class="printed-text">Credits:</label>
    <output id="token-wallet-output" class="led-display">0000</output>
  </div>
  
  <div id="name-panel" class="printed-text">
    GROVER'S GAMBLING
  </div>

  <div id="slot-panel">
    <div id="result-panel">
      <output class="status-annoucment led-display text-pulsing">YOU WON</output>
      <output id="correct-value-output" class="led-display">0</output>
      <output class="status-annoucment led-display text-pulsing">YOU LOST</output>
    </div>
    
    <div id="slot-reel-panel">
      <div id="reel-slot-1" class="led-display reel-slot">0</div>
      <div id="reel-slot-2" class="led-display reel-slot">0</div>
      <div id="reel-slot-3" class="led-display reel-slot">0</div>  
      <div id="reel-slot-4" class="led-display reel-slot">0</div>
    </div>
  
  </div>
  
  
  <div id="control-panel">
    
    <button id="spin-button" class="ordinary-btn">
      <span>Spin !!!</span>  
    </button>
  
    <output id="gains-output" class="led-display" >.....</output>
    <div id="bet-inputs-panel">
      <input id="token-bet-input" class="led-display led-input">
      <input id="swing-bet-input" class="led-display led-input"/>
    </div>
      
  </div>
</div>
