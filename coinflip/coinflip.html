<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum Coin</title>
<style>
  * { box-sizing: border-box; }

  body { font-family: "Courier New", monospace; }

  #machine {
    width: 500px; max-width: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }

  .scene { perspective: 600px; width: 150px; height: 150px; }
  .coin { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
  .coin.settle { transition: transform 0.9s cubic-bezier(.2,.8,.3,1); }
  .face {
    position: absolute; inset: 0; border-radius: 50%;
    display: grid; place-items: center;
    font: bold 3.5em "Courier New"; color: #111;
    backface-visibility: hidden;
    border: 5px solid rgba(0,0,0,.25);
  }
  .face.zero { background: gold; }
  .face.one  { background: aqua; transform: rotateY(180deg); }

  #fields { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: .85em; }

  .led-display {
    border-radius: 10px;
    padding: 12px 18px;
    background: #111;
    color: #ff3b30;
    border: 2px solid rgb(255 0 0);
    font: bold 1.25em "Courier New";
    text-align: end;
    display: block;
    width: 100%;
  }
  .led-display:disabled { color: gray; }

  .ordinary-btn { background: rgb(153 0 0); border-radius: 10px; padding: 0; border: 0; cursor: pointer; }
  .ordinary-btn span {
    display: block; background: rgb(255 0 0); color: white;
    padding: 10px 40px; border-radius: 10px;
    transform: translateY(-6px); transition: transform 200ms;
    font: bold 2em "Courier New";
  }
  .ordinary-btn:active span { transform: translateY(-1px); }
  .ordinary-btn:disabled { background: grey; cursor: default; }
  .ordinary-btn:disabled span { background: gainsboro; color: black; }

  @media (prefers-reduced-motion: reduce) { .coin.settle { transition: none; } }
</style>
</head>
<body>
<div id="machine">

  <div class="scene">
    <div class="coin" id="coin">
      <div class="face zero">0</div>
      <div class="face one">1</div>
    </div>
  </div>

  <button id="spin-button" class="ordinary-btn"><span>Flip !!!</span></button>

  <div id="fields">
    <div class="field"><label>Tokens</label><output id="wallet" class="led-display">5000</output></div>
    <div class="field"><label>Result</label><output id="result" class="led-display">.....</output></div>
    <div class="field"><label for="bet">Bet</label><input id="bet" class="led-display" type="number" value="500"></div>
    <div class="field"><label for="side">Side (0 / 1)</label><input id="side" min="0" max="1" step="1" class="led-display" type="number" value="0"></div>
    <div class="field"><label>Chance</label><output id="chance" class="led-display">.....</output></div>
    <div class="field"><label>Potential Win</label><output id="gains" class="led-display">.....</output></div>
  </div>

</div>
<script>
  const $ = id => document.getElementById(id);
  const coin = $("coin"), btn = $("spin-button"), label = btn.querySelector("span");
  const MIN_BET = 500;
  const EDGE = 0.97;      // house edge: expected return is 97 % of the bet
  const MAX_MULT = 100;

  let wallet = 5000, start = null, raf = null;

  // ---- Quantum round (browser emulation of a one-qubit circuit) ----
  // Circuit: |0> -> RY(theta) -> measure.  P(0) = cos^2(theta / 2).
  // Same math as the Qiskit version in cf.py, only the measurement is
  // sampled with Math.random() instead of Qiskit's AerSimulator.
  function playRound(casMs, side) {
    const t = (casMs / 1000) % 2;            // one full coin spin = 2 s
    const theta = t * Math.PI;               // rotation angle of the qubit
    const p0 = Math.cos(theta / 2) ** 2;     // probability of measuring 0
    const pMine = side === 0 ? p0 : 1 - p0;
    const mult = Math.max(1, Math.min(Math.round(EDGE / Math.max(pMine, 1e-9) * 100) / 100, MAX_MULT));
    const landed = Math.random() < p0 ? 0 : 1;   // one measurement (1 shot)
    return { landed, won: landed === side, mult, pMine };
  }

  const clamp = (el, min, max) => {
    const v = Math.min(Math.max(Math.round(Number(el.value) || min), min), max);
    el.value = v;
    return v;
  };
  const showWallet = () => { $("wallet").value = String(wallet).padStart(4, "0"); };
  const lock = on => { $("bet").disabled = on; $("side").disabled = on; };

  function tick() {
    const t = ((performance.now() - start) / 1000) % 2;
    coin.style.transform = `rotateY(${t * 180}deg)`;
    raf = requestAnimationFrame(tick);
  }

  function stop() {
    cancelAnimationFrame(raf);
    const casMs = performance.now() - start;
    start = null;
    btn.disabled = true;
    label.textContent = "...";
    const bet = Number($("bet").value), side = Number($("side").value);

    const d = playRound(casMs, side);
    const net = Math.floor(bet * (d.mult - 1));

    $("chance").value = (d.pMine * 100).toFixed(1) + "%";
    $("gains").value = net;

    setTimeout(() => {
      coin.classList.add("settle");
      coin.style.transform = `rotateY(${720 + (d.landed === 1 ? 180 : 0)}deg)`;

      setTimeout(() => {
        if (d.won) { wallet += net; $("result").value = "WON +" + net; }
        else       { wallet -= bet; $("result").value = "LOST -" + bet; }
        showWallet();
        done();
      }, 950);
    }, 1500);
  }

  function done() {
    lock(false);
    label.textContent = "Flip !!!";
    if (wallet < MIN_BET) { $("result").value = "GAME OVER"; return; }
    clamp($("bet"), MIN_BET, wallet);
    btn.disabled = false;
  }

  btn.onclick = () => {
    if (start === null) {
      clamp($("bet"), MIN_BET, wallet);
      clamp($("side"), 0, 1);
      coin.classList.remove("settle");
      $("result").value = ".....";
      lock(true);
      label.textContent = "Stop !!!";
      start = performance.now();
      tick();
    } else {
      stop();
    }
  };

  showWallet();
</script>
</body>
</html>
